apiVersion: catalog.example.io/v1alpha1
kind: DataContract
metadata:
  name: customer-360
  domain: customer
  owner: data.customer-platform@example.com
  steward: customer-analytics@example.com
  version: 0.1.0
  status: draft
  classification: internal
spec:
  description: Canonical customer profile used by downstream analytics and service operations.
  dataProduct: customer-360-profile
  interfaces:
    - name: daily-export
      type: batch
      format: parquet
      location: s3://example/customer-360/daily/
    - name: query-api
      type: api
      format: json
      location: https://api.example.test/customer-360
  schema:
    type: object
    required:
      - customer_id
      - status
      - updated_at
    properties:
      customer_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
        format: date-time
      segment:
        type: string
  quality:
    slos:
      freshness: "24h"
      completeness: "99.5%"
      validity: "99.0%"
  controls:
    required:
      - schema-validation
      - owner-approval
      - classification-check
      - nonprod-test-run
  automation:
    ansible:
      generateVars: true
      targetAAPProject: data-contract-catalog-poc
      targetInventoryGroup: nonprod
