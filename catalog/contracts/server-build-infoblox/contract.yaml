apiVersion: catalog.example.io/v1alpha1
kind: InfrastructureContract
metadata:
  name: server-build-infoblox
  domain: provisioning
  owner: infrastructure-architecture@example.test
  steward: automation-engineering@example.test
  version: 0.1.0
  status: draft
  classification: internal
spec:
  description: Contract for server provisioning inputs and Infoblox allocation behavior used by Ansible automation.
  useCase: aap-infoblox-provisioning
  requiredInputs:
    - request_id
    - enterprise_app_id
    - hostname
    - datacenter
    - is_zta
    - zta_classification
    - zta_environment
    - zta_exposure
  inputs:
    request_id:
      type: string
      source: itsm
    enterprise_app_id:
      type: string
      source: cmdb
    hostname:
      type: string
      source: build-request
    datacenter:
      type: string
      source: cmdb
      allowedValues:
        - rtp
        - km
        - lab
    is_zta:
      type: boolean
      source: build-request
    zta_classification:
      type: string
      source: classification-policy
      allowedValues:
        - public
        - internal
        - confidential
        - sharedservices
        - management
    zta_environment:
      type: string
      source: classification-policy
      allowedValues:
        - prod
        - preprod
        - qa
        - test
        - dev
    zta_exposure:
      type: string
      source: classification-policy
      allowedValues:
        - core
        - external
        - dmz
  derivedValues:
    ea_microsegment_id:
      expression: zone_<zta_environment>_<zta_classification>_<zta_exposure>
  externalInteractions:
    - name: subnet-lookup
      system: infoblox
      selector:
        - ea_microsegment_id
        - datacenter
      expectations:
        eligibleSubnetStatus: active
        eligibleAllocationPool: true
    - name: next-available-ip
      system: infoblox
      input: subnet-reference
      output: allocated-ip
    - name: host-record-update
      system: infoblox
      outputFields:
        - Zone
        - Application
        - RequestID
        - DataClassification
        - aap_managed
        - app_sdlc_environment
  controls:
    required:
      - schema-validation
      - enum-validation
      - owner-approval
      - nonprod-simulation-pass
  automation:
    ansible:
      navigatorEntrypoint: true
      generateVars: true
      supportMockInfoblox: true
