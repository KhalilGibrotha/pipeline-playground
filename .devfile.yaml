schemaVersion: 2.2.0
metadata:
  name: pipeline-playground
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 4Gi
      mountSources: true
      endpoints:
        - name: docs
          targetPort: 8080
commands:
  - id: install-tooling
    exec:
      component: tools
      commandLine: >-
        python3 -m pip install --user --requirement requirements-dev.txt
      workingDir: ${PROJECT_SOURCE}
  - id: show-versions
    exec:
      component: tools
      commandLine: >-
        bash -lc "ansible --version && ansible-lint --version && molecule --version && yamllint --version"
      workingDir: ${PROJECT_SOURCE}
  - id: validate
    exec:
      component: tools
      commandLine: bash scripts/validate.sh
      workingDir: ${PROJECT_SOURCE}
  - id: test-readiness-lifecycle
    exec:
      component: tools
      commandLine: >-
        bash -lc "cd ansible && ansible-playbook playbooks/test-readiness-lifecycle.yml"
      workingDir: ${PROJECT_SOURCE}
  - id: shell
    exec:
      component: tools
      commandLine: bash
      workingDir: ${PROJECT_SOURCE}
