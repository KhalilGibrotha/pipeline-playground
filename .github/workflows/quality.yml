name: Repository quality

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Privacy, encoding, and artifact checks
    runs-on: ubuntu-latest
    env:
      REPOSITORY_BLOCKED_TOKEN_HASHES: ${{ secrets.REPOSITORY_BLOCKED_TOKEN_HASHES }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Scan every tracked artifact
        run: python3 scripts/check_repository_hygiene.py --all

  automation-validation:
    name: Catalog and Ansible validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python3 -m pip install --requirement requirements-dev.txt

      - name: Run validation suite
        run: bash scripts/validate.sh
