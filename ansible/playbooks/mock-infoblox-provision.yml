---
- name: Mock provisioning flow from contract to Infoblox payload
  hosts: localhost
  gather_facts: false
  vars:
    address_management_root: >-
      {{ playbook_dir }}/../../catalog/domains/network-services/products/address-management
    contract_file: "{{ address_management_root }}/contracts/address-allocation/contract.yaml"
    adapter_file: "{{ address_management_root }}/adapters/infoblox/adapter.yaml"
    infoblox_mock_dir: "{{ playbook_dir }}/../../simulations/infoblox"
    generated_vars_dir: "{{ playbook_dir }}/../generated-vars"
  pre_tasks:
    - name: Load provider-neutral address-allocation contract
      ansible.builtin.include_vars:
        file: "{{ contract_file }}"
        name: active_contract

    - name: Load Infoblox implementation adapter
      ansible.builtin.include_vars:
        file: "{{ adapter_file }}"
        name: active_adapter

    - name: Verify adapter contract reference
      ansible.builtin.assert:
        that:
          - active_adapter.spec.implements == active_contract.metadata.id
        fail_msg: Infoblox adapter does not implement the selected address-allocation contract.

    - name: Ensure generated vars directory exists
      ansible.builtin.file:
        path: "{{ generated_vars_dir }}"
        state: directory
        mode: "0755"

  roles:
    - role: contract_preflight
    - role: contract_generate_vars
    - role: mock_infoblox

  post_tasks:
    - name: Show mock provisioning summary
      ansible.builtin.debug:
        msg:
          request_id: "{{ request_id }}"
          hostname: "{{ hostname }}"
          network_selector: "{{ network_selector }}"
          selected_subnet: "{{ selected_subnet.network }}"
          allocated_ip: "{{ allocated_ip }}"
          generated_vars_file: "{{ generated_vars_file }}"
