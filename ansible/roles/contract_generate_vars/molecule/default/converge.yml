---
- name: Exercise normalized variable generation
  hosts: all
  gather_facts: false
  tasks:
    - name: Generate normalized contract variables  # noqa var-naming[no-role-prefix]
      ansible.builtin.include_role:
        name: contract_generate_vars
      vars:
        request_id: REQ-MOLECULE-0001
        application_id: APP-MOLECULE-01
        hostname: molecule-001.example.test
        site: lab
        network_profile: application-internal
        application_environment: test
        data_classification: internal
        dns_domain: example.test
        contract_preflight_network_selector: application-internal_test_internal
        generated_vars_dir: "{{ molecule_ephemeral_directory }}/artifacts"
