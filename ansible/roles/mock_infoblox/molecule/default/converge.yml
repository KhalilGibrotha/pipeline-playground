---
- name: Exercise mocked Infoblox behavior
  hosts: all
  gather_facts: false
  vars:
    simulation_root: "{{ playbook_dir }}/../../../../../simulations/infoblox"
    artifact_root: "{{ molecule_ephemeral_directory }}/artifacts"

  tasks:
    - name: Allocate address for eligible request  # noqa var-naming[no-role-prefix]
      ansible.builtin.include_role:
        name: mock_infoblox
      vars:
        request_id: REQ-MOLECULE-0001
        enterprise_app_id: APP-MOLECULE-01
        hostname: molecule-001.example.test
        datacenter: rtp
        is_zta: true
        zta_classification: internal
        app_sdlc_environment: production
        ea_microsegment_id: zone_prod_internal_core
        infoblox_mock_dir: "{{ simulation_root }}"
        generated_vars_dir: "{{ artifact_root }}"

    - name: Verify request without an eligible subnet is rejected
      block:
        - name: Attempt allocation with no matching subnet  # noqa var-naming[no-role-prefix]
          ansible.builtin.include_role:
            name: mock_infoblox
          vars:
            request_id: REQ-MOLECULE-NO-SUBNET
            enterprise_app_id: APP-MOLECULE-01
            hostname: molecule-no-subnet.example.test
            datacenter: km
            is_zta: true
            zta_classification: confidential
            app_sdlc_environment: production
            ea_microsegment_id: zone_prod_confidential_dmz
            infoblox_mock_dir: "{{ simulation_root }}"
            generated_vars_dir: "{{ artifact_root }}"

        - name: Record unexpected subnet match
          ansible.builtin.set_fact:
            no_subnet_rejected: false

      rescue:
        - name: Record expected subnet rejection
          ansible.builtin.set_fact:
            no_subnet_rejected: true

    - name: Assert missing subnet was rejected
      ansible.builtin.assert:
        that:
          - no_subnet_rejected | bool
