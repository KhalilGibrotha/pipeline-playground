---
driver:
  name: default

platforms:
  - name: instance

provisioner:
  name: ansible
  inventory:
    host_vars:
      instance:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - syntax
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
