---
- name: Assert required inputs are present
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item, default='') | string | length > 0
    fail_msg: "Required contract input '{{ item }}' is missing or empty."
    success_msg: "Required contract input '{{ item }}' is present."
  loop: "{{ active_contract.spec.requiredInputs }}"

- name: Assert site is allowed
  ansible.builtin.assert:
    that:
      - site in active_contract.spec.inputs.site.allowedValues
    fail_msg: "site '{{ site }}' is not allowed."

- name: Assert network profile is allowed
  ansible.builtin.assert:
    that:
      - network_profile in active_contract.spec.inputs.network_profile.allowedValues
    fail_msg: "network_profile '{{ network_profile }}' is not allowed."

- name: Assert application environment is allowed
  ansible.builtin.assert:
    that:
      - >-
        application_environment in
        active_contract.spec.inputs.application_environment.allowedValues
    fail_msg: "application_environment '{{ application_environment }}' is not allowed."

- name: Assert data classification is allowed
  ansible.builtin.assert:
    that:
      - data_classification in active_contract.spec.inputs.data_classification.allowedValues
    fail_msg: "data_classification '{{ data_classification }}' is not allowed."

- name: Derive provider-neutral network selector
  ansible.builtin.set_fact:
    network_selector: >-
      {{ network_profile | lower }}_{{ application_environment | lower }}_{{ data_classification | lower }}
