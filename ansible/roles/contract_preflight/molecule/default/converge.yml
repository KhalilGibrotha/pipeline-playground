---
- name: Exercise contract preflight behavior
  hosts: all
  gather_facts: false
  vars:
    contract_file: >-
      {{ playbook_dir }}/../../../../../catalog/contracts/server-build-infoblox/contract.yaml

  pre_tasks:
    - name: Load infrastructure contract
      ansible.builtin.include_vars:
        file: "{{ contract_file }}"
        name: active_contract

  tasks:
    - name: Validate supported request  # noqa var-naming[no-role-prefix]
      ansible.builtin.include_role:
        name: contract_preflight
      vars:
        request_id: REQ-MOLECULE-0001
        enterprise_app_id: APP-MOLECULE-01
        hostname: molecule-001.example.test
        datacenter: rtp
        is_zta: true
        zta_classification: internal
        zta_environment: prod
        zta_exposure: core

    - name: Assert deterministic zone derivation
      ansible.builtin.assert:
        that:
          - ea_microsegment_id == 'zone_prod_internal_core'

    - name: Verify invalid datacenter is rejected
      block:
        - name: Attempt unsupported request  # noqa var-naming[no-role-prefix]
          ansible.builtin.include_role:
            name: contract_preflight
          vars:
            request_id: REQ-MOLECULE-INVALID
            enterprise_app_id: APP-MOLECULE-01
            hostname: molecule-invalid.example.test
            datacenter: unsupported
            is_zta: true
            zta_classification: internal
            zta_environment: prod
            zta_exposure: core

        - name: Record unexpected acceptance
          ansible.builtin.set_fact:
            invalid_request_rejected: false

      rescue:
        - name: Record expected rejection
          ansible.builtin.set_fact:
            invalid_request_rejected: true

    - name: Assert invalid request was rejected
      ansible.builtin.assert:
        that:
          - invalid_request_rejected | bool
